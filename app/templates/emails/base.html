<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ subject }}</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #f4f6f8;
    font-family: Arial, Helvetica, sans-serif;
">

<table width="100%"
       cellpadding="0"
       cellspacing="0"
       style="background-color:#f4f6f8; padding:40px 0;">

    <tr>
        <td align="center">

            <table width="600"
                   cellpadding="0"
                   cellspacing="0"
                   style="
                        max-width:600px;
                        width:100%;
                        background:#ffffff;
                        border-radius:10px;
                        overflow:hidden;
                   ">

                <!-- Header -->

                <tr>
                    <td style="
                        padding:25px 30px;
                        background:#ffffff;
                        border-bottom:1px solid #eeeeee;
                    ">

                        <h1 style="
                            margin:0;
                            color:#1f2937;
                            font-size:26px;
                        ">
                            99-Hectare
                        </h1>

                        <p style="
                            margin:5px 0 0;
                            color:#6b7280;
                            font-size:13px;
                        ">
                            Find your place. Build your future.
                        </p>

                    </td>
                </tr>

                <!-- Content -->

                <tr>
                    <td style="
                        padding:35px 30px;
                        color:#374151;
                        font-size:15px;
                        line-height:1.6;
                    ">

                        {{ content }}

                    </td>
                </tr>

                <!-- Footer -->

                <tr>
                    <td style="
                        padding:25px 30px;
                        background:#f9fafb;
                        border-top:1px solid #eeeeee;
                        text-align:center;
                    ">

                        <p style="
                            margin:0;
                            color:#6b7280;
                            font-size:12px;
                        ">
                            © 2026 99-Hectare. All rights reserved.
                        </p>

                        <p style="
                            margin:8px 0 0;
                            color:#9ca3af;
                            font-size:12px;
                        ">
                            This is an automated email. Please do not reply.
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>

</table>

</body>
</html>
