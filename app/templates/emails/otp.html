<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>99-Hectare Verification Code</title>
</head>

<body style="
    margin:0;
    padding:0;
    background:#f4f6f8;
    font-family:Arial, Helvetica, sans-serif;
">

<table width="100%"
       cellpadding="0"
       cellspacing="0"
       style="padding:40px 0; background:#f4f6f8;">

    <tr>
        <td align="center">

            <table width="600"
                   cellpadding="0"
                   cellspacing="0"
                   style="
                       max-width:600px;
                       width:100%;
                       background:#ffffff;
                       border-radius:10px;
                       overflow:hidden;
                   ">

                <tr>
                    <td style="
                        padding:25px 30px;
                        border-bottom:1px solid #eeeeee;
                    ">

                        <h1 style="
                            margin:0;
                            font-size:26px;
                            color:#1f2937;
                        ">
                            99-Hectare
                        </h1>

                    </td>
                </tr>

                <tr>
                    <td style="padding:40px 30px;">

                        <h2 style="
                            margin:0 0 15px;
                            color:#111827;
                        ">
                            Verify your email
                        </h2>

                        <p style="
                            color:#4b5563;
                            line-height:1.6;
                        ">
                            Use the verification code below to
                            continue with your 99-Hectare account.
                        </p>

                        <div style="
                            margin:30px 0;
                            padding:18px;
                            background:#f3f4f6;
                            border-radius:8px;
                            text-align:center;
                        ">

                            <span style="
                                font-size:32px;
                                font-weight:bold;
                                letter-spacing:8px;
                                color:#111827;
                            ">
                                {{ otp }}
                            </span>

                        </div>

                        <p style="
                            color:#6b7280;
                            font-size:13px;
                            line-height:1.5;
                        ">
                            This code will expire in
                            <strong>{{ expiry_minutes }} minutes</strong>.
                        </p>

                        <p style="
                            color:#6b7280;
                            font-size:13px;
                        ">
                            If you didn't request this code,
                            you can safely ignore this email.
                        </p>

                    </td>
                </tr>

                <tr>
                    <td style="
                        padding:25px;
                        background:#f9fafb;
                        text-align:center;
                    ">

                        <p style="
                            margin:0;
                            color:#9ca3af;
                            font-size:12px;
                        ">
                            © 2026 99-Hectare
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>

</table>

</body>
</html>
